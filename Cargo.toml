[package]
name = "hornbill"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A local, state-owned interactive story engine"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "net", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
